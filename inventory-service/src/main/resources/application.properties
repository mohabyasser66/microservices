spring.application.name=inventory_service
server.port=8083

# DATABASE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3316/inventory_service
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use MySql dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# # DATA INITIALIZATION
# spring.jpa.defer-datasource-initialization=true
# spring.sql.init.mode=always

# OpenAPI / Swagger configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://<keycloak-host>/realms/<realm>/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://<keycloak-host>/realms/<realm>